schemaVersion: 1
id: ai-numpad
name: AI Numpad
controlSurface: numpad
enabled: true
layerKey: NumLock
bindings:
  - id: open-herdr
    physicalCode: Numpad5
    trigger: press
    actionId: app.open_or_focus
    adapterId: herdr
    consumeOriginal: true
    config:
      whenFocused: new_task
  - id: voice-input
    physicalCode: Numpad0
    trigger: hold
    actionId: voice.input
    adapterId: papegoye
    consumeOriginal: true
    config:
      shortcut: "fn+space"
  - id: agent-continue
    physicalCode: NumpadEnter
    trigger: press
    actionId: agent.continue
    adapterId: herdr
    consumeOriginal: true
    config: {}
