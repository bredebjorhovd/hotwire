[package]
name = "hotwire-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Tauri 2 desktop shell for Hotwire"

[lib]
name = "hotwire_desktop_lib"

[build-dependencies]
tauri-build.workspace = true

[dependencies]
hotwire-adapter-herdr = { path = "../../../adapters/herdr" }
hotwire-adapter-comet = { path = "../../../adapters/comet" }
hotwire-adapter-tools = { path = "../../../adapters/tools" }
hotwire-adapter-papegoye = { path = "../../../adapters/papegoye" }
hotwire-adapter-sdk = { path = "../../../crates/hotwire-adapter-sdk" }
hotwire-core = { path = "../../../crates/hotwire-core" }
hotwire-input-macos = { path = "../../../crates/hotwire-input-macos" }
hotwire-profile = { path = "../../../crates/hotwire-profile" }
hotwire-router = { path = "../../../crates/hotwire-router" }
hotwire-runner = { path = "../../../crates/hotwire-runner" }
serde.workspace = true
serde_json.workspace = true
tauri.workspace = true
tokio = { workspace = true, features = ["sync"] }

[dev-dependencies]
async-trait.workspace = true
tokio = { workspace = true, features = ["sync", "rt-multi-thread"] }

[lints]
workspace = true
